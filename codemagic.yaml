workflows:
  friday_android:
    name: FRIDAY v1.1 APK
    max_build_duration: 60

    environment:
      groups:
        - friday_secrets

    scripts:
      - name: Install Gradle
        script: |
          cd android
          gradle --version

      - name: Build FRIDAY APK
        script: |
          cd android
          gradle assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
